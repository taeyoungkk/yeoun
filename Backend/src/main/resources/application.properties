spring.application.name=Backend

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

app.invite.base-url=${APP_INVITE_BASE_URL:http://localhost:3000/invites}
app.kafka.trip-location-log-topic=${KAFKA_TRIP_LOCATION_LOG_TOPIC:trip-location-log-batch}
app.kafka.photo-processing-request-topic=${KAFKA_PHOTO_REQUEST_TOPIC:photo-processing-request}
app.kafka.photo-processing-result-topic=${KAFKA_PHOTO_RESULT_TOPIC:photo-processing-result}
app.kafka.photo-processing-result-group=${KAFKA_PHOTO_RESULT_GROUP:backend-photo-processing}
app.photo-processing.presigned-url-expire-seconds=${APP_PHOTO_PROCESSING_PRESIGNED_EXPIRE_SECONDS:900}

# 1. 우리 패키지의 모든 로그를 상세히(DEBUG) 본다
logging.level.com.yeoun=DEBUG
# 2. 하이버네이트가 생성하는 SQL 쿼리문을 콘솔에 찍는다 (DB 적재 확인용)
logging.level.org.hibernate.SQL=DEBUG
# 3. 쿼리에 들어가는 실제 값(GPS 좌표 등)을 로그로 확인한다
logging.level.org.hibernate.orm.jdbc.bind=TRACE