spring.application.name=Backend

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

app.invite.base-url=${APP_INVITE_BASE_URL:http://localhost:3000/invites}
app.kafka.trip-location-log-topic=${KAFKA_TRIP_LOCATION_LOG_TOPIC:trip-location-log-batch}
app.kafka.photo-processing-request-topic=${KAFKA_PHOTO_REQUEST_TOPIC:photo-processing-request}
app.kafka.photo-processing-result-topic=${KAFKA_PHOTO_RESULT_TOPIC:photo-processing-result}
app.kafka.photo-processing-result-group=${KAFKA_PHOTO_RESULT_GROUP:backend-photo-processing}
app.photo-processing.image-base-url=${APP_PHOTO_PROCESSING_IMAGE_BASE_URL:}
