spring.config.import=optional:file:.env[.properties]

spring.application.name=Backend

spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.out-of-order=true
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.mail.enabled=false

app.invite.base-url=${APP_INVITE_BASE_URL:http://localhost:3000/invites}
app.kafka.trip-location-log-topic=${KAFKA_TRIP_LOCATION_LOG_TOPIC:trip-location-log-batch}
app.kafka.trip-location-log-result-topic=${KAFKA_TRIP_LOCATION_LOG_RESULT_TOPIC:trip-location-log-result}
app.kafka.trip-location-log-result-group=${KAFKA_TRIP_LOCATION_LOG_RESULT_GROUP:backend-trip-location-log-result}
app.finance.enabled=${FINANCE_ENABLED:false}
app.finance.base-url=${FINANCE_BASE_URL:https://finopenapi.ssafy.io}
app.finance.institution-code=${FINANCE_INSTITUTION_CODE:00100}
app.finance.fintech-app-no=${FINANCE_FINTECH_APP_NO:001}
app.finance.api-key=${FINANCE_API_KEY:}
app.finance.sync-range-days=${FINANCE_SYNC_RANGE_DAYS:365}

app.location-log-retention.raw-ttl-days=${APP_LOCATION_LOG_RETENTION_RAW_TTL_DAYS:90}
app.location-log-retention.clean-ttl-days=${APP_LOCATION_LOG_RETENTION_CLEAN_TTL_DAYS:90}
app.location-log-retention.cleanup-cron=${APP_LOCATION_LOG_RETENTION_CLEANUP_CRON:0 0 3 * * *}
app.location-log-retention.cleanup-zone=${APP_LOCATION_LOG_RETENTION_CLEANUP_ZONE:Asia/Seoul}

app.kafka.photo-processing-request-topic=${KAFKA_PHOTO_REQUEST_TOPIC:photo-processing-request}
app.kafka.photo-processing-result-topic=${KAFKA_PHOTO_RESULT_TOPIC:photo-processing-result}
app.kafka.photo-processing-result-group=${KAFKA_PHOTO_RESULT_GROUP:backend-photo-processing}
app.photo-processing.presigned-url-expire-seconds=${APP_PHOTO_PROCESSING_PRESIGNED_EXPIRE_SECONDS:900}

logging.level.com.yeoun=INFO
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN
