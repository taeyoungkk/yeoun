spring.config.import=optional:file:.env[.properties]

# 운영 DB (도커 컴포즈 내부망 접속)
spring.datasource.url=${DB_URL:jdbc:postgresql://postgres:5432/yeoun}
spring.datasource.username=${DB_USERNAME:yeoun}
spring.datasource.password=${DB_PASSWORD:yeoun1234}
spring.datasource.driver-class-name=org.postgresql.Driver

# 운영 Redis (도커 컴포즈 내부망 접속)
spring.data.redis.host=${REDIS_HOST:redis}
spring.data.redis.port=${REDIS_PORT:6379}

# JWT 및 보안
jwt.secret=${JWT_SECRET}
jwt.access-token-expiration-seconds=${JWT_ACCESS_EXPIRE_SECONDS:1800}
jwt.refresh-token-expiration-seconds=${JWT_REFRESH_EXPIRE_SECONDS:1209600}

# 메일 서버
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.mail.from=${MAIL_FROM}
app.invite.base-url=${APP_INVITE_BASE_URL}

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}
app.kafka.trip-location-log-topic=${KAFKA_TRIP_LOCATION_LOG_TOPIC:trip-location-log-batch}

# OAuth 및 AWS
oauth.google.client-id=${GOOGLE_CLIENT_ID}
oauth.google.jwk-set-uri=${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}

aws.access-key-id=${AWS_ACCESS_KEY_ID}
aws.secret-access-key=${AWS_SECRET_ACCESS_KEY}
aws.region=${AWS_REGION}
aws.s3.bucket=${AWS_S3_BUCKET}

# 1. 우리 패키지의 모든 로그를 상세히(DEBUG) 본다
logging.level.com.yeoun=DEBUG
# 2. 하이버네이트가 생성하는 SQL 쿼리문을 콘솔에 찍는다 (DB 적재 확인용)
logging.level.org.hibernate.SQL=DEBUG
# 3. 쿼리에 들어가는 실제 값(GPS 좌표 등)을 로그로 확인한다
logging.level.org.hibernate.orm.jdbc.bind=TRACE
# 4. 카프카 컨슈머가 메시지를 잘 가져오는지 확인
logging.level.org.apache.kafka=WARN
logging.level.org.springframework.kafka=WARN