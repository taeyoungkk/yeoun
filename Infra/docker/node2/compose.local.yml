services:
  kafka:
    ports:
      - "${KAFKA_EXTERNAL_PORT:-9092}:9092"

  worker:
    ports:
      - "${WORKER_HOST_PORT:-8000}:${WORKER_CONTAINER_PORT:-8000}"

  nginx:
    ports:
      - "${NGINX_HTTP_PORT:-8081}:80"
    volumes:
      - ./nginx/default.local.conf:/etc/nginx/conf.d/default.conf:ro