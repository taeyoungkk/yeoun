services:
  kafka:
    image: bitnami/kafka:latest
    container_name: yeoun-kafka
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./volumes/kafka_data:/bitnami/kafka
    environment:
      - KAFKA_CFG_NODE_ID=1
      - KAFKA_CFG_PROCESS_ROLES=broker,controller
      - KAFKA_CFG_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_CFG_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093
      - KAFKA_CFG_ADVERTISED_LISTENERS=PLAINTEXT://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9092}
      - KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      - KAFKA_CFG_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_KRAFT_CLUSTER_ID=${KAFKA_CLUSTER_ID}
      - KAFKA_HEAP_OPTS=-Xmx512m -Xms512m
    healthcheck:
      test: ["CMD-SHELL", "/opt/bitnami/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 20s
      timeout: 10s
      retries: 5
    networks:
      - worker-net

  worker:
    image: ${WORKER_IMAGE:-yeoun-worker:local}
    container_name: yeoun-worker
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${WORKER_CONTAINER_PORT:-8000}"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - worker-net

  nginx:
    image: nginx:1.27-alpine
    container_name: yeoun-worker-nginx
    restart: unless-stopped
    depends_on:
      - worker
    volumes:
      - ./volumes/yeoun-images:/usr/share/nginx/images:ro
    networks:
      - worker-net

networks:
  worker-net:
    driver: bridge