services:
  kafka:
    image: apache/kafka:4.1.1
    container_name: yeoun-kafka
    restart: unless-stopped
    env_file:
      - .env
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_EXTERNAL_PORT:-9092}
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      KAFKA_CLUSTER_ID: ${KAFKA_CLUSTER_ID}
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - ./volumes/kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/localhost/9092'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

    networks:
      - worker-net

  worker:
    image: ${WORKER_IMAGE:-yeoun-worker:local}
    container_name: yeoun-worker
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${WORKER_CONTAINER_PORT:-8000}"
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - worker-net

  nginx:
    image: nginx:1.27-alpine
    container_name: yeoun-worker-nginx
    restart: unless-stopped
    depends_on:
      - worker
    volumes:
      - ./volumes/yeoun-images:/usr/share/nginx/images:ro
    networks:
      - worker-net

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=${KAFKA_CLUSTER_ID:-yeoun-kafka-cluster-1}
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=yeoun-kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - worker-net

networks:
  worker-net:
    driver: bridge
