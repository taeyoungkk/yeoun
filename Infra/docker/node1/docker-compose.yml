services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: yeoun-postgres
    restart: unless-stopped
    env_file:
      - .env
    volumes:
      - ./volumes/postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - service-net

  redis:
    image: redis:7.0-alpine
    container_name: yeoun-redis
    restart: unless-stopped
    env_file:
      - .env
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - ./volumes/redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "PING"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - service-net

  api:
    image: ${API_IMAGE:-yeoun-api:local}
    container_name: yeoun-api
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "${API_CONTAINER_PORT:-8080}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - service-net

  nginx:
    image: nginx:1.27-alpine
    container_name: yeoun-service-nginx
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - service-net

networks:
  service-net:
    driver: bridge