# Infra/docker/node1/nginx/default.ec2.conf

# 1. HTTP(80)로 접속하면 무조건 HTTPS(443)로 쫓아냄 (리다이렉트)
server {
    listen 80;
    server_name j14b105.p.ssafy.io;

    location / {
        return 301 https://$host$request_uri;
    }
}

# 2. 진짜 메인 문지기: HTTPS(443) 설정
server {
    listen 443 ssl;
    server_name j14b105.p.ssafy.io;

    # Certbot이 발급해둔 인증서 위치 (건드리지 마세요!)
    ssl_certificate /etc/letsencrypt/live/p.ssafy.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/p.ssafy.io/privkey.pem;

    # SSL 보안 강화 설정 (옵션이지만 권장)
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}